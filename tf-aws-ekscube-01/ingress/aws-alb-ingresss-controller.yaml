apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-2048-alb-ingress
  namespace: default
  annotations:
    # ALB를 생성하도록 지정
    alb.ingress.kubernetes.io/scheme: internet-facing  # 외부 노출용 (내부용은 internal)
    alb.ingress.kubernetes.io/target-type: ip         # Fargate 사용 시 필수, EC2에서도 권장 (Pod IP 직접 타겟팅)
    # 필요한 경우 보안 그룹이나 리스너 포트 추가 설정 가능
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
spec:
  ingressClassName: alb  # AWS Load Balancer Controller가 이 설정을 보고 ALB 생성
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-2048  # 연결할 Service 이름
                port:
                  number: 80           # Service의 포트