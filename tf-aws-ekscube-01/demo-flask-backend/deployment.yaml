

apiVersion: v1
kind: Namespace
metadata:
  name: demo-flask-backend


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-flask-backend
  namespace: demo-flask-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-flask-backend
  template:
    metadata:
      labels:
        app: demo-flask-backend
    spec:
      containers:
        - name: demo-flask-backend
          image: 813307607383.dkr.ecr.ap-northeast-2.amazonaws.com/demo-flask-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080