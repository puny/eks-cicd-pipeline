

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "backend-ingress"
  namespace: "demo-flask-backend"
  annotations:
    # kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: cost=eks-cicd-cluster-demo-flask-backend-ingress,Name=eks-cicd-cluster-demo-flask-backend-ingress

spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
        - path: /contents
          pathType: Prefix
          backend:
            service:
              name: "demo-flask-backend"
              port: 
                number: 8080
