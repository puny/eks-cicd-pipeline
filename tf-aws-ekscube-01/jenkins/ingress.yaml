apiVersion: v1
kind: Service
metadata:
  namespace: jenkins
  name: service-jenkins
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: NodePort
  selector:
    app.kubernetes.io/name: jenkins

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: jenkins
  name: ingress-jenkins
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: cost=eks-cicd-cluster-jenkins,Name=eks-cicd-cluster-jenkins
    
spec:
  ingressClassName: alb  
  rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: service-jenkins
              port:
                number: 8080